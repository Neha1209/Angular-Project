<section class="page">
    <header class="page-header">
        <h1>Onboarding</h1>
        <p class="page-subtitle">Please fill in the required information below.</p>
    </header>

    <form [formGroup]="formData" (ngSubmit)="onSubmit()">
        <div class="card">
            <h2 class="section-title">Personal Details</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" formControlName="name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" formControlName="email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" formControlName="phone">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" formControlName="password">
                </div>
            </div>
            <label class="checkbox-field">
                <input type="checkbox" (change)="onToggleCompanyDetails($event)">
                <span>Register as a business?</span>
            </label>
        </div>

        <div class="card" *ngIf="isCompnyDetailsVisible" formGroupName="companyDetails" style="margin-top: 24px;">
            <h2 class="section-title">Company Details</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="companyName" formControlName="companyName">
                </div>
                <div class="form-group">
                    <label for="companyAddress">Company Address</label>
                    <input type="text" id="companyAddress" name="companyAddress" formControlName="companyAddress">
                </div>
                <div class="form-group">
                    <label for="companyPhone">Company Phone</label>
                    <input type="tel" id="companyPhone" name="companyPhone" formControlName="companyPhone">
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 24px;">
            <div class="section-header">
                <h2 class="section-title">Signatories</h2>
                <button type="button" class="btn btn-secondary btn-sm" (click)="addSignatory()">+ Add Signatory</button>
            </div>
            <div formArrayName="signatories">
                <div class="signatory-row" *ngFor="let signatory of $any(formData.get('signatories')).controls; let i = index" [formGroupName]="i">
                    <div class="form-group">
                        <label [attr.for]="'signatoryName-' + i">Name</label>
                        <input type="text" [id]="'signatoryName-' + i" formControlName="name">
                    </div>
                    <div class="form-group">
                        <label [attr.for]="'signatoryEmail-' + i">Email</label>
                        <input type="email" [id]="'signatoryEmail-' + i" name="signatoryEmail" formControlName="email">
                    </div>
                    <button type="button" class="btn btn-danger btn-sm" (click)="removeSignatory(i)">Remove</button>
                </div>
                <p class="empty-state" *ngIf="$any(formData.get('signatories')).controls.length === 0">No signatories added yet.</p>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 24px;">Submit</button>
    </form>
</section>
